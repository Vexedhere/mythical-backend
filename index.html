<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        body { 
            background: #020b08; 
            color: #f3f4f6; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 10% 10%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            z-index: -1;
        }

        .glass-nav { 
            background: rgba(4, 20, 16, 0.65); 
            backdrop-filter: blur(25px); 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .glass-card { 
            background: rgba(6, 26, 21, 0.55); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(16, 185, 129, 0.15); 
            border-radius: 28px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .glass-card:hover { 
            border-color: rgba(16, 185, 129, 0.4); 
            transform: translateY(-2px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
        }

        .chat-user { 
            background: linear-gradient(135deg, #059669, #0284c7); 
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25); 
        }

        .chat-ai { 
            background: rgba(10, 35, 28, 0.6); 
            border: 1px solid rgba(16, 185, 129, 0.12); 
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .voice-mode-active {
            animation: pulse-ring 1.8s infinite;
            background: linear-gradient(135deg, #10b981, #06b6d4) !important;
            color: #020b08 !important;
            border-color: #34d399 !important;
        }
    </style>
</head>
<body class="flex flex-col">
    <div class="bg-mesh"></div>

    <div id="voice-status-pill" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden glass-card px-5 py-2.5 flex items-center gap-3 border-emerald-500/40 animate__animated animate__fadeInDown">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
        <span id="voice-status-text" class="text-xs font-semibold text-emerald-300">Voice-to-Voice Active • Listening...</span>
        <button onclick="toggleVoiceMode()" class="ml-2 text-gray-400 hover:text-white text-xs bg-white/10 px-2 py-0.5 rounded-lg">End Call</button>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[120] hidden">
        <div class="glass-card p-8 w-full max-w-md mx-4 border-emerald-500/30 text-center relative animate__animated animate__zoomIn animate__faster">
            <button onclick="toggleAuthModal(false)" class="absolute top-5 right-5 text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-emerald-500/20 text-emerald-400">
                <i class="fas fa-wand-magic-sparkles"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">Unlock Pro Features</h2>
            <p class="text-xs text-emerald-400 font-semibold tracking-wider uppercase mb-3">SiliconFlow Image Gen & Multimodal Tools</p>
            <p class="text-gray-300 text-xs leading-relaxed mb-6">
                Sign in with your Google account to unlock HD Image Generation with FLUX.1 and priority generation quotas.
            </p>
            
            <div id="g_id_onload" 
                 data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com" 
                 data-callback="handleGoogleResponse">
            </div>
            <div class="g_id_signin flex justify-center scale-105 mb-3" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
            <button onclick="toggleAuthModal(false)" class="text-[11px] text-gray-500 hover:text-gray-300 transition-colors">Continue in Guest Mode</button>
        </div>
    </div>

    <div id="main-app" class="flex h-full">
        <aside class="w-80 glass-nav flex flex-col p-6 z-10">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-9 h-9 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                    <i class="fas fa-bolt text-lg"></i>
                </div>
                <div>
                    <div class="text-xl font-bold tracking-tight uppercase leading-none">Spark<span class="text-emerald-400">.</span>ai <span class="text-xs text-emerald-400 font-mono">V2</span></div>
                    <span class="text-[9px] text-gray-500 tracking-wider font-semibold">INTELLIGENCE CORE</span>
                </div>
            </div>

            <nav class="space-y-2 mb-6">
                <button onclick="createNewSession()" class="w-full text-left p-3.5 hover:bg-white/5 rounded-2xl border border-transparent hover:border-emerald-500/20 transition-all font-semibold flex items-center gap-3 text-sm">
                    <div class="w-8 h-8 bg-emerald-500/10 rounded-xl flex items-center justify-center"><i class="fas fa-plus text-xs text-emerald-400"></i></div>
                    New Session
                </button>
            </nav>

            <div class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-3 px-2">Generators</div>
            <div class="grid grid-cols-1 gap-2 mb-6 text-xs">
                <button onclick="triggerImageButton()" class="p-2.5 rounded-xl bg-white/5 hover:bg-emerald-500/10 border border-white/5 hover:border-emerald-500/30 text-gray-300 hover:text-emerald-400 flex items-center justify-between transition-all group">
                    <span class="flex items-center gap-2.5">
                        <i class="fas fa-wand-magic-sparkles text-emerald-400"></i> SiliconFlow Image Gen
                    </span>
                    <span id="img-lock-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 text-[9px] font-bold border border-emerald-500/20 group-hover:bg-emerald-500 group-hover:text-black transition-all">PRO</span>
                </button>
            </div>

            <div class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-3 px-2">Recent Chats</div>
            <div id="history" class="flex-1 overflow-y-auto space-y-2 text-xs custom-scroll"></div>

            <div class="mt-auto pt-4 flex items-center justify-between border-t border-white/5">
                <div class="flex items-center gap-3">
                    <img id="user-pfp" class="w-10 h-10 rounded-xl border border-emerald-500/30 hidden object-cover">
                    <div id="pfp-fallback" class="w-10 h-10 rounded-xl bg-emerald-600/10 flex items-center justify-center text-emerald-400 border border-emerald-500/20 font-bold">G</div>
                    <div class="overflow-hidden">
                        <p id="display-name" class="font-bold text-sm truncate w-28">Guest User</p>
                        <p id="display-rank" class="text-[8px] text-gray-400 font-bold uppercase tracking-widest">GUEST MODE</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button id="auth-action-btn" onclick="toggleAuthModal(true)" class="text-xs px-2.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 font-semibold transition-all">
                        Sign In
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative">
            <div id="chat" class="flex-1 overflow-y-auto p-10 space-y-8 custom-scroll pb-36"></div>
            
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-3xl px-6">
                <div class="glass-card p-2 flex items-center gap-2 border-white/10 shadow-[0_10px_30px_-10px_rgba(16,185,129,0.15)] focus-within:border-emerald-500/40 transition-all">
                    
                    <button id="v2v-btn" onclick="toggleVoiceMode()" title="Hands-Free Voice Mode" class="text-gray-400 hover:text-emerald-400 w-11 h-11 rounded-2xl flex items-center justify-center transition-all bg-white/5 hover:bg-white/10 border border-white/5">
                        <i id="v2v-icon" class="fas fa-headset text-sm"></i>
                    </button>

                    <input id="input" 
                           onkeydown="handleKeyDown(event)" 
                           class="flex-1 bg-transparent py-3.5 px-3 text-sm outline-none placeholder:text-gray-500" 
                           placeholder="Message Spark AI V2, tap headset for Voice-to-Voice...">

                    <button onclick="send()" class="bg-gradient-to-r from-emerald-500 to-cyan-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center transition-all active:scale-95 hover:opacity-90 shadow-md shadow-emerald-500/20">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const OPENROUTER_API_KEY = "YOUR_OPENROUTER_API_KEY_HERE";
        const SILICONFLOW_API_KEY = "YOUR_SILICONFLOW_API_KEY_HERE";

        const OPENROUTER_MODELS = [
            "openrouter/free",
            "deepseek/deepseek-chat",
            "meta-llama/llama-3.3-70b-instruct:free",
            "meta-llama/llama-3.1-8b-instruct:free"
        ];

        const SILICONFLOW_IMAGE_MODELS = [
            "black-forest-labs/FLUX.1-schnell",
            "stabilityai/stable-diffusion-3-5-large-turbo",
            "Kwai-Kolors/Kolors"
        ];

        let currentUser = {
            id: "guest",
            isGuest: true,
            email: "",
            name: "Guest User",
            rank: "GUEST MODE",
            picture: null
        };

        let sessions = [];
        let currentSessionId = null;

        /* ========== HANDS-FREE VOICE-TO-VOICE ENGINE ========== */
        let isVoiceMode = false;
        let isRecognizing = false;
        let isAiSpeaking = false;
        let recognitionInstance = null;
        let silenceTimer = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognitionInstance = new SpeechRecognition();
            recognitionInstance.continuous = true;
            recognitionInstance.interimResults = true;
            recognitionInstance.lang = 'en-US';

            recognitionInstance.onresult = (event) => {
                if (isAiSpeaking) return; // Prevent mic from hearing AI response

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentText = finalTranscript || interimTranscript;
                if (currentText.trim()) {
                    document.getElementById("input").value = currentText;
                    updateVoiceStatus("Listening: " + (currentText.length > 25 ? currentText.substring(0, 25) + "..." : currentText));

                    // Debounce silence: When user stops speaking for 1.2s, auto-send
                    clearTimeout(silenceTimer);
                    silenceTimer = setTimeout(() => {
                        if (isVoiceMode && !isAiSpeaking && document.getElementById("input").value.trim()) {
                            stopRecognitionEngine();
                            send();
                        }
                    }, 1200);
                }
            };

            recognitionInstance.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    console.warn("Speech Recognition Info:", event.error);
                }
            };

            recognitionInstance.onend = () => {
                isRecognizing = false;
                // If voice mode is still enabled and AI is not speaking, restart listening
                if (isVoiceMode && !isAiSpeaking) {
                    startRecognitionEngine();
                }
            };
        }

        function toggleVoiceMode() {
            if (!recognitionInstance || !('speechSynthesis' in window)) {
                alert("Voice-to-Voice requires browser SpeechRecognition and SpeechSynthesis support (Chrome, Edge, Brave recommended).");
                return;
            }

            isVoiceMode = !isVoiceMode;
            const btn = document.getElementById("v2v-btn");
            const pill = document.getElementById("voice-status-pill");

            if (isVoiceMode) {
                btn.classList.add("voice-mode-active");
                pill.classList.remove("hidden");
                updateVoiceStatus("Voice Mode Connected • Listening...");
                startRecognitionEngine();
            } else {
                btn.classList.remove("voice-mode-active");
                pill.classList.add("hidden");
                stopRecognitionEngine();
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            }
        }

        function startRecognitionEngine() {
            if (recognitionInstance && !isRecognizing && !isAiSpeaking) {
                try {
                    recognitionInstance.start();
                    isRecognizing = true;
                } catch (e) {}
            }
        }

        function stopRecognitionEngine() {
            if (recognitionInstance && isRecognizing) {
                try {
                    recognitionInstance.stop();
                    isRecognizing = false;
                } catch (e) {}
            }
        }

        function updateVoiceStatus(text) {
            const el = document.getElementById("voice-status-text");
            if (el) el.innerText = text;
        }

        function speakAIResponse(text, onCompleteCallback) {
            if (!('speechSynthesis' in window)) {
                if (onCompleteCallback) onCompleteCallback();
                return;
            }

            window.speechSynthesis.cancel();

            // Filter markdown formatting and codeblocks for natural speech output
            const naturalSpeech = text
                .replace(/```[\s\S]*?```/g, 'Code snippet provided in chat.')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/#+\s/g, '')
                .replace(/\*+/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .trim();

            if (!naturalSpeech) {
                if (onCompleteCallback) onCompleteCallback();
                return;
            }

            isAiSpeaking = true;
            stopRecognitionEngine();
            updateVoiceStatus("Spark Speaking...");

            const utterance = new SpeechSynthesisUtterance(naturalSpeech);
            utterance.rate = 1.05;
            utterance.pitch = 1.0;

            utterance.onend = () => {
                isAiSpeaking = false;
                if (isVoiceMode) {
                    updateVoiceStatus("Listening for your reply...");
                    startRecognitionEngine();
                }
                if (onCompleteCallback) onCompleteCallback();
            };

            utterance.onerror = () => {
                isAiSpeaking = false;
                if (isVoiceMode) startRecognitionEngine();
                if (onCompleteCallback) onCompleteCallback();
            };

            window.speechSynthesis.speak(utterance);
        }

        /* ========== CODE BLOCK RENDERER ========== */
        const customRenderer = {
            code(arg1, arg2) {
                let codeText = "";
                let lang = "code";

                if (typeof arg1 === 'object' && arg1 !== null) {
                    codeText = arg1.text || arg1.raw || "";
                    lang = arg1.lang || "code";
                } else {
                    codeText = typeof arg1 === 'string' ? arg1 : String(arg1 || '');
                    lang = typeof arg2 === 'string' && arg2 ? arg2 : "code";
                }

                return `
                <div class="code-box-wrapper my-4 rounded-2xl overflow-hidden border border-emerald-500/20 bg-[#040e0b] shadow-xl">
                    <div class="flex items-center justify-between px-4 py-2.5 bg-white/5 border-b border-white/5 text-xs text-gray-400">
                        <span class="code-font font-bold uppercase text-[11px] text-emerald-400 tracking-wider flex items-center gap-2">
                            <i class="fas fa-code text-[10px]"></i> ${escapeHtml(lang)}
                        </span>
                        <button onclick="copyCode(this)" class="copy-btn flex items-center gap-1.5 hover:text-white transition-all bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-lg text-xs border border-emerald-500/20">
                            <i class="far fa-copy text-xs"></i> <span>Copy</span>
                        </button>
                    </div>
                    <pre class="p-4 overflow-x-auto text-xs text-gray-200 code-font custom-scroll leading-relaxed"><code>${escapeHtml(codeText)}</code></pre>
                </div>`;
            }
        };

        marked.use({ renderer: customRenderer });

        function escapeHtml(string) {
            return String(string)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function insertPromptPrefix(prefix) {
            const input = document.getElementById("input");
            input.value = prefix;
            input.focus();
        }

        function triggerImageButton() {
            if (currentUser.isGuest) {
                toggleAuthModal(true);
            } else {
                insertPromptPrefix('/image ');
            }
        }

        window.copyCode = function(button) {
            const wrapper = button.closest('.code-box-wrapper');
            if (!wrapper) return;
            const codeEl = wrapper.querySelector('code');
            const codeText = codeEl ? codeEl.innerText : '';

            const showCopied = () => {
                const originalHtml = button.innerHTML;
                button.innerHTML = `<i class="fas fa-check text-emerald-400"></i> <span class="text-emerald-400 font-semibold">Copied!</span>`;
                setTimeout(() => { button.innerHTML = originalHtml; }, 2000);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText).then(showCopied).catch(() => fallbackCopy(codeText, showCopied));
            } else {
                fallbackCopy(codeText, showCopied);
            }
        };

        function fallbackCopy(text, callback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                if (callback) callback();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function getSystemPrompt() {
            return `You are Spark AI V2, an advanced, high-performance intelligent system.
${isVoiceMode ? 'CRITICAL: The user is currently in interactive hands-free VOICE-TO-VOICE mode. Keep answers concise, direct, conversational, and avoid excessively long code dumps unless explicitly asked.' : ''}
Current Active User Session:
- User Name: ${currentUser?.name || "Guest User"}
- Designated Role / Rank: ${currentUser?.rank || "GUEST MODE"}
- Is Guest Mode: ${currentUser?.isGuest ? "Yes" : "No"}`;
        }

        function toggleAuthModal(show) {
            const modal = document.getElementById("auth-modal");
            if (show) modal.classList.remove("hidden");
            else modal.classList.add("hidden");
        }

        function handleGoogleResponse(res) {
            try {
                const payload = JSON.parse(atob(res.credential.split('.')[1]));
                const email = payload.email || "";
                
                currentUser = { 
                    id: payload.sub,
                    isGuest: false,
                    email: email,
                    name: payload.name || "Verified User", 
                    rank: "PRO MEMBER",
                    picture: payload.picture 
                };

                localStorage.setItem("spark_logged_user", JSON.stringify(currentUser));
                toggleAuthModal(false);
                updateUserUI();
                loadUserSessions();
            } catch (e) {
                console.error("Authentication Error", e);
            }
        }

        function updateUserUI() {
            const nameEl = document.getElementById("display-name");
            const rankEl = document.getElementById("display-rank");
            const pfpFallback = document.getElementById("pfp-fallback");
            const userPfp = document.getElementById("user-pfp");
            const authBtn = document.getElementById("auth-action-btn");
            const lockBadge = document.getElementById("img-lock-badge");

            nameEl.innerText = currentUser.name;
            rankEl.innerText = currentUser.rank;

            if (currentUser.isGuest) {
                rankEl.className = "text-[8px] text-gray-400 font-bold uppercase tracking-widest";
                authBtn.innerHTML = `Sign In`;
                authBtn.onclick = () => toggleAuthModal(true);
                userPfp.classList.add("hidden");
                pfpFallback.classList.remove("hidden");
                pfpFallback.innerText = "G";
                if (lockBadge) lockBadge.innerText = "PRO";
            } else {
                authBtn.innerHTML = `<i class="fas fa-power-off text-red-400"></i>`;
                authBtn.onclick = logout;
                if (lockBadge) lockBadge.innerText = "ACTIVE";
                rankEl.className = "text-[8px] text-emerald-400 font-bold uppercase tracking-widest";

                if (currentUser.picture) {
                    userPfp.src = currentUser.picture;
                    userPfp.classList.remove("hidden");
                    pfpFallback.classList.add("hidden");
                } else {
                    pfpFallback.innerText = currentUser.name ? currentUser.name[0].toUpperCase() : "U";
                    pfpFallback.classList.remove("hidden");
                    userPfp.classList.add("hidden");
                }
            }
        }

        function getStorageKey() {
            return `spark_v2_chats_${currentUser.id}`;
        }

        function loadUserSessions() {
            const rawData = localStorage.getItem(getStorageKey());
            sessions = rawData ? JSON.parse(rawData) : [];
            renderSidebar();

            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                createNewSession();
            }
        }

        function saveSessions() {
            localStorage.setItem(getStorageKey(), JSON.stringify(sessions));
            renderSidebar();
        }

        function createNewSession() {
            const newSession = {
                id: 'sess_' + Date.now(),
                title: 'New Conversation',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                messages: []
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions();
            
            document.getElementById("chat").innerHTML = "";
            triggerWelcome();
        }

        function loadSession(sessionId) {
            currentSessionId = sessionId;
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return;

            renderSidebar();
            const chatContainer = document.getElementById("chat");
            chatContainer.innerHTML = "";

            if (session.messages.length === 0) {
                triggerWelcome();
            } else {
                session.messages.forEach(msg => {
                    renderMessageUI(msg.role, msg.content, false);
                });
            }
        }

        function deleteSession(e, sessionId) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions();
            
            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                createNewSession();
            }
        }

        function renderSidebar() {
            const historyContainer = document.getElementById("history");
            historyContainer.innerHTML = "";

            sessions.forEach(sess => {
                const isActive = sess.id === currentSessionId;
                const item = document.createElement("div");
                item.className = `group flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all border ${
                    isActive 
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' 
                    : 'border-transparent text-gray-400 hover:bg-white/5 hover:text-gray-200'
                }`;
                item.onclick = () => loadSession(sess.id);

                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i class="far fa-comments text-xs"></i>
                        <div class="truncate font-medium text-xs w-36">${sess.title}</div>
                    </div>
                    <button onclick="deleteSession(event, '${sess.id}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 transition-opacity p-1">
                        <i class="fas fa-trash-alt text-[10px]"></i>
                    </button>
                `;
                historyContainer.appendChild(item);
            });
        }

        function triggerWelcome() {
            let msg = "";
            if (currentUser.isGuest) {
                msg = `### ⚡ Spark AI V2 Active\nVoice-to-Voice hands-free mode ready. Tap the headset icon to talk live.\n\n*Tip:* Sign in with Google to unlock SiliconFlow Image Generation (\`/image\`).`;
            } else {
                msg = `### ⚡ Spark AI V2 Pro Active\nWelcome back, **${currentUser.name}**! Hands-free Voice-to-Voice, SiliconFlow image synthesis, and pro quotas active.`;
            }
            
            const aiBox = renderMessageUI("ai", "", false);
            let i = 0;
            function type() {
                if (i < msg.length) {
                    aiBox.querySelector('.ai-body').innerHTML = marked.parse(msg.substring(0, i + 1));
                    i++;
                    setTimeout(type, 8);
                }
            }
            type();
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }

        // Dedicated Square Aspect-Ratio Image Loader
        async function handleSiliconFlowImageGen(rawPrompt, aiBox, activeSession) {
            const prompt = rawPrompt.trim();
            const cleanSfKey = typeof SILICONFLOW_API_KEY !== 'undefined' ? SILICONFLOW_API_KEY.trim() : "";
            const boxId = 'img_box_' + Date.now();
            const aiBody = aiBox.querySelector('.ai-body');

            aiBody.innerHTML = `
                <div class="space-y-3 w-full max-w-[420px]">
                    <div class="flex items-center justify-between text-xs">
                        <span class="flex items-center gap-2 text-emerald-400 font-bold uppercase tracking-wider">
                            <i class="fas fa-wand-magic-sparkles"></i> Image Synthesizer
                        </span>
                        <span class="text-[10px] text-gray-400 font-mono">1:1 Square HD</span>
                    </div>

                    <div id="${boxId}" class="relative w-full aspect-square rounded-3xl overflow-hidden border border-emerald-500/20 bg-[#03120c] flex items-center justify-center shadow-2xl">
                        <div class="loader-circle-container flex flex-col items-center justify-center gap-4 text-center p-6">
                            <div class="relative w-16 h-16 flex items-center justify-center">
                                <div class="absolute inset-0 rounded-full border-4 border-emerald-500/20"></div>
                                <div class="absolute inset-0 rounded-full border-4 border-emerald-400 border-t-transparent animate-spin"></div>
                                <i class="fas fa-sparkles text-emerald-400 text-sm animate-pulse"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-white tracking-wide">Synthesizing Pixels</p>
                                <p class="text-[10px] text-emerald-400/80 font-mono mt-0.5">SiliconFlow Engine</p>
                            </div>
                        </div>
                    </div>

                    <p class="text-xs text-gray-400 italic truncate">Prompt: "${escapeHtml(prompt)}"</p>
                </div>`;

            let imageUrl = null;

            if (cleanSfKey) {
                const endpoints = [
                    "https://api.siliconflow.cn/v1/images/generations",
                    "https://api.siliconflow.com/v1/images/generations"
                ];

                for (const endpoint of endpoints) {
                    for (const model of SILICONFLOW_IMAGE_MODELS) {
                        try {
                            const res = await fetch(endpoint, {
                                method: "POST",
                                headers: {
                                    "Authorization": `Bearer ${cleanSfKey}`,
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    model: model,
                                    prompt: prompt,
                                    image_size: "1024x1024",
                                    batch_size: 1
                                })
                            });

                            const data = await res.json();
                            if (res.ok && data.images && data.images[0]?.url) {
                                imageUrl = data.images[0].url;
                                break;
                            }
                        } catch (err) {}
                    }
                    if (imageUrl) break;
                }
            }

            if (!imageUrl) {
                const seed = Math.floor(Math.random() * 99999999);
                const encodedPrompt = encodeURIComponent(prompt);
                imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=flux&width=1024&height=1024&seed=${seed}&nologo=true&enhance=true`;
            }

            const targetContainer = document.getElementById(boxId);
            if (targetContainer) {
                const preloader = new Image();
                preloader.src = imageUrl;
                preloader.onload = () => {
                    targetContainer.innerHTML = `
                        <img src="${imageUrl}" alt="${escapeHtml(prompt)}" class="w-full h-full object-cover rounded-3xl animate__animated animate__fadeIn">
                        <div class="absolute bottom-3 right-3 flex gap-2">
                            <a href="${imageUrl}" target="_blank" download="spark_${Date.now()}.jpg" class="px-3 py-1.5 bg-black/70 backdrop-blur-md hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-white/10 transition-all shadow-lg">
                                <i class="fas fa-download"></i> Save HD
                            </a>
                        </div>`;
                };
            }

            activeSession.messages.push({ role: "ai", content: `![${prompt}](${imageUrl})` });
            saveSessions();

            if (isVoiceMode) {
                speakAIResponse("I've generated the image you requested.");
            }
        }

        async function send() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            clearTimeout(silenceTimer);
            
            let activeSession = sessions.find(s => s.id === currentSessionId);
            if (!activeSession) return;

            if (activeSession.messages.length === 0) {
                activeSession.title = text.length > 22 ? text.substring(0, 22) + "..." : text;
            }

            const lowerText = text.toLowerCase().trim();
            let isImageRequest = false;
            let imagePrompt = "";

            if (lowerText.startsWith("/image ")) {
                isImageRequest = true;
                imagePrompt = text.substring(7).trim();
            } else if (lowerText.startsWith("generate image of ")) {
                isImageRequest = true;
                imagePrompt = text.substring(18).trim();
            } else if (lowerText.startsWith("generate image ")) {
                isImageRequest = true;
                imagePrompt = text.substring(15).trim();
            } else if (lowerText.startsWith("draw ")) {
                isImageRequest = true;
                imagePrompt = text.substring(5).trim();
            }

            if (isImageRequest) {
                if (currentUser.isGuest) {
                    toggleAuthModal(true);
                    return;
                }
                activeSession.messages.push({ role: "user", content: text });
                renderMessageUI("user", text, true);
                const aiBox = renderMessageUI("ai", ``, true);
                await handleSiliconFlowImageGen(imagePrompt, aiBox, activeSession);
                return;
            }

            activeSession.messages.push({ role: "user", content: text });
            renderMessageUI("user", text, true);

            const aiBox = renderMessageUI("ai", `<i class="fas fa-bolt text-emerald-400 animate-pulse mr-2"></i>`, true);
            const chatContainer = document.getElementById("chat");
            const aiBody = aiBox.querySelector('.ai-body');

            const cleanKey = typeof OPENROUTER_API_KEY !== 'undefined' ? OPENROUTER_API_KEY.trim() : "";
            if (!cleanKey) {
                aiBody.innerHTML = `<span class="text-red-400 font-medium">Missing Key:</span> Please configure <code>OPENROUTER_API_KEY</code>.`;
                return;
            }

            const apiHistory = activeSession.messages.map(m => ({
                role: m.role === 'ai' ? 'assistant' : 'user',
                content: m.content
            }));

            let streamedContent = "";
            let streamSucceeded = false;
            let lastError = null;

            for (const model of OPENROUTER_MODELS) {
                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: { 
                            "Authorization": `Bearer ${cleanKey}`,
                            "HTTP-Referer": window.location.origin || "http://localhost",
                            "X-Title": "Spark AI V2",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                { role: "system", content: getSystemPrompt() },
                                ...apiHistory
                            ],
                            stream: true,
                            temperature: 0.5,
                            max_tokens: 2048
                        })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        lastError = errData.error?.message || `HTTP ${res.status}`;
                        continue;
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    aiBody.innerHTML = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split("\n");

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith("data: ") && trimmed !== "data: [DONE]") {
                                try {
                                    const json = JSON.parse(trimmed.substring(6));
                                    const delta = json.choices[0]?.delta?.content || "";
                                    if (delta) {
                                        streamedContent += delta;
                                        aiBody.innerHTML = marked.parse(streamedContent);
                                        chatContainer.scrollTop = chatContainer.scrollHeight;
                                    }
                                } catch (e) {}
                            }
                        }
                    }

                    if (streamedContent.trim().length > 0) {
                        streamSucceeded = true;
                        activeSession.messages.push({ role: "ai", content: streamedContent });
                        saveSessions();
                        
                        // Enable manual Listen button
                        const ttsBtn = aiBox.querySelector('.tts-btn');
                        if (ttsBtn) {
                            ttsBtn.classList.remove('hidden');
                            ttsBtn.onclick = () => speakAIResponse(streamedContent);
                        }

                        // If in Voice-to-Voice Mode, automatically speak back
                        if (isVoiceMode) {
                            speakAIResponse(streamedContent);
                        }
                        break;
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            if (!streamSucceeded) {
                console.error("Spark AI V2 Engine Error:", lastError);
                aiBody.innerHTML = `<span class="text-red-400 font-medium">Neural connection failed:</span> ${lastError}`;
                if (isVoiceMode) {
                    speakAIResponse("Connection failed. Please check API key.");
                }
            }
        }

        function renderMessageUI(role, content, shouldScroll) {
            const div = document.createElement("div");
            div.className = `flex ${role === "user" ? "justify-end" : "justify-start"} animate__animated animate__fadeInUp animate__faster`;
            
            if (role === 'user') {
                div.innerHTML = `<div class="max-w-[80%] px-6 py-4 rounded-3xl chat-user text-white text-sm leading-relaxed">${escapeHtml(content)}</div>`;
            } else {
                div.innerHTML = `
                <div class="max-w-[80%] px-6 py-4 rounded-3xl chat-ai text-gray-200 text-sm leading-relaxed relative group">
                    <div class="ai-body">${content ? marked.parse(content) : ''}</div>
                    <button class="tts-btn ${content ? '' : 'hidden'} mt-2.5 text-[11px] text-gray-400 hover:text-emerald-400 bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg transition-all flex items-center gap-1.5 border border-white/5" title="Read Aloud">
                        <i class="fas fa-volume-high"></i> Listen
                    </button>
                </div>`;
                
                const ttsBtn = div.querySelector('.tts-btn');
                if (content && ttsBtn) {
                    ttsBtn.onclick = () => speakAIResponse(content);
                }
            }
            
            const chatContainer = document.getElementById("chat");
            chatContainer.appendChild(div);
            if (shouldScroll) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            return div.querySelector('.chat-ai');
        }

        function logout() { 
            localStorage.removeItem("spark_logged_user");
            currentUser = {
                id: "guest",
                isGuest: true,
                email: "",
                name: "Guest User",
                rank: "GUEST MODE",
                picture: null
            };
            updateUserUI();
            loadUserSessions();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem("spark_logged_user");
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                } catch(e) {
                    localStorage.removeItem("spark_logged_user");
                }
            }
            updateUserUI();
            loadUserSessions();
        });
    </script>
</body>
