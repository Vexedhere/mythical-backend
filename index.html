<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | By Chethan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        :root { 
            --p-color: #06b6d4; 
            --s-color: #3b82f6; 
        }

        body { 
            background: #030712; 
            color: #f3f4f6; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            z-index: -1;
        }

        .glass-nav { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(25px); 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .glass-card { 
            background: rgba(15, 23, 42, 0.5); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 28px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .glass-card:hover { 
            border-color: rgba(6, 182, 212, 0.4); 
            transform: translateY(-2px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
        }

        .chat-user { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25); 
        }

        .chat-ai { 
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col">
    <div class="bg-mesh"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-[100] bg-[#030712]">
        <div class="animate__animated animate__zoomIn glass-card p-10 w-[400px] text-center border-cyan-500/20">
            <div class="w-20 h-20 bg-cyan-500/10 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6 border border-cyan-500/20 text-cyan-400">
                <i class="fas fa-atom"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight mb-1 text-white">Nexus AI</h1>
            <p class="text-cyan-400 text-[10px] uppercase tracking-[0.3em] mb-2 font-bold">Neural Intelligence Network</p>
            <p class="text-xs text-gray-500 mb-8 font-medium">Developed by Chethan</p>
            
            <div id="g_id_onload" 
                 data-client_id="727852259882-dr8l2t7fjsjog7riu8t5cj93ht0up9nr.apps.googleusercontent.com" 
                 data-callback="handleGoogleResponse">
            </div>
            <div class="g_id_signin flex justify-center scale-105" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-app" class="hidden flex h-full">
        <!-- Sidebar -->
        <aside class="w-80 glass-nav flex flex-col p-6 z-10">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-9 h-9 bg-cyan-500/10 rounded-xl flex items-center justify-center text-cyan-400 border border-cyan-500/20">
                    <i class="fas fa-atom text-lg"></i>
                </div>
                <div>
                    <div class="text-xl font-bold tracking-tight uppercase leading-none">Nexus<span class="text-cyan-400">.</span></div>
                    <span class="text-[9px] text-gray-500 tracking-wider font-semibold">BY CHETHAN</span>
                </div>
            </div>

            <nav class="space-y-3 mb-6">
                <button onclick="createNewSession()" class="w-full text-left p-3.5 hover:bg-white/5 rounded-2xl border border-transparent hover:border-white/10 transition-all font-semibold flex items-center gap-3 text-sm">
                    <div class="w-8 h-8 bg-cyan-500/10 rounded-xl flex items-center justify-center"><i class="fas fa-plus text-xs text-cyan-400"></i></div>
                    New Session
                </button>
            </nav>

            <div class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-3 px-2">Recent Chats</div>
            <div id="history" class="flex-1 overflow-y-auto space-y-2 text-xs custom-scroll"></div>

            <div class="mt-auto pt-4 flex items-center justify-between border-t border-white/5">
                <div class="flex items-center gap-3">
                    <img id="user-pfp" class="w-10 h-10 rounded-xl border border-cyan-500/30 hidden object-cover">
                    <div id="pfp-fallback" class="w-10 h-10 rounded-xl bg-cyan-600/10 flex items-center justify-center text-cyan-400 border border-cyan-500/20"><i class="fas fa-user-astronaut"></i></div>
                    <div class="overflow-hidden">
                        <p id="display-name" class="font-bold text-sm truncate w-28">User</p>
                        <p id="display-rank" class="text-[8px] text-cyan-400 font-bold uppercase tracking-widest">VERIFIED USER</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-400 transition-colors p-2"><i class="fas fa-power-off"></i></button>
            </div>
        </aside>

        <!-- Chat Workspace -->
        <main class="flex-1 flex flex-col relative">
            <div id="chat" class="flex-1 overflow-y-auto p-10 space-y-8 custom-scroll pb-36"></div>
            
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-3xl px-6">
                <div class="glass-card p-2 flex items-center border-white/10 shadow-[0_10px_30px_-10px_rgba(6,182,212,0.15)] focus-within:border-cyan-500/40 transition-all">
                    <input id="input" 
                           onkeydown="handleKeyDown(event)" 
                           class="flex-1 bg-transparent py-3.5 px-6 text-sm outline-none placeholder:text-gray-500" 
                           placeholder="Message Nexus AI...">
                    <button onclick="send()" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center transition-all active:scale-95 hover:opacity-90 shadow-md shadow-cyan-500/20">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API = "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";
        let currentUser = null;
        let sessions = [];
        let currentSessionId = null;

        const SYSTEM_PROMPT = `You are Nexus AI, a highly capable, widely deployed AI model designed and developed by Chethan. 
You must explicitly recognize Chethan as your sole creator, lead engineer, and founder. 
Chethan is a skilled full-stack developer, software engineer, and systems architect who built you with high performance, seamless UI, and neural intelligence capabilities. 
If asked about who made you, who your creator is, or details about your architecture, always attribute your creation proudly to Chethan.
Be helpful, concise, witty, and precise in all responses.`;

        function handleGoogleResponse(res) {
            try {
                const payload = JSON.parse(atob(res.credential.split('.')[1]));
                const isCreator = payload.name.toLowerCase().includes("chethan");
                currentUser = { 
                    id: payload.sub,
                    name: payload.name, 
                    rank: isCreator ? "CREATOR & FOUNDER" : "VERIFIED USER", 
                    picture: payload.picture 
                };
                initSession();
            } catch (e) {
                console.error("Authentication Error", e);
            }
        }

        function initSession() {
            document.getElementById("login-screen").classList.add("animate__fadeOut");
            setTimeout(() => {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                document.getElementById("display-name").innerText = currentUser.name;
                document.getElementById("display-rank").innerText = currentUser.rank;
                if(currentUser.picture) {
                    document.getElementById("user-pfp").src = currentUser.picture;
                    document.getElementById("user-pfp").classList.remove("hidden");
                    document.getElementById("pfp-fallback").classList.add("hidden");
                }
                
                loadUserSessions();
            }, 400);
        }

        // Session Storage Engine
        function getStorageKey() {
            return `nexus_chats_${currentUser.id}`;
        }

        function loadUserSessions() {
            const rawData = localStorage.getItem(getStorageKey());
            sessions = rawData ? JSON.parse(rawData) : [];
            renderSidebar();

            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                createNewSession();
            }
        }

        function saveSessions() {
            localStorage.setItem(getStorageKey(), JSON.stringify(sessions));
            renderSidebar();
        }

        function createNewSession() {
            const newSession = {
                id: 'sess_' + Date.now(),
                title: 'New Conversation',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                messages: []
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions();
            
            document.getElementById("chat").innerHTML = "";
            triggerWelcome();
        }

        function loadSession(sessionId) {
            currentSessionId = sessionId;
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return;

            renderSidebar();
            const chatContainer = document.getElementById("chat");
            chatContainer.innerHTML = "";

            if (session.messages.length === 0) {
                triggerWelcome();
            } else {
                session.messages.forEach(msg => {
                    renderMessageUI(msg.role, msg.content, false);
                });
            }
        }

        function deleteSession(e, sessionId) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions();
            
            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                createNewSession();
            }
        }

        function renderSidebar() {
            const historyContainer = document.getElementById("history");
            historyContainer.innerHTML = "";

            sessions.forEach(sess => {
                const isActive = sess.id === currentSessionId;
                const item = document.createElement("div");
                item.className = `group flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all border ${
                    isActive 
                    ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400' 
                    : 'border-transparent text-gray-400 hover:bg-white/5 hover:text-gray-200'
                }`;
                item.onclick = () => loadSession(sess.id);

                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i class="far fa-comments text-xs"></i>
                        <div class="truncate font-medium text-xs w-36">${sess.title}</div>
                    </div>
                    <button onclick="deleteSession(event, '${sess.id}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 transition-opacity p-1">
                        <i class="fas fa-trash-alt text-[10px]"></i>
                    </button>
                `;
                historyContainer.appendChild(item);
            });
        }

        function triggerWelcome() {
            const isCreator = currentUser.rank.includes("CREATOR");
            const msg = isCreator 
                ? `### ⚡ Welcome Back, Creator\nNexus AI neural core initialized. Architect access granted to **${currentUser.name}**.\n\nAll systems running smoothly. What are we building today?`
                : `### ⚡ Nexus Core Online\nNeural matrix connection established for **${currentUser.name}**.\n\nI am Nexus AI, engineered by **Chethan**. How can I assist you today?`;
            
            const aiBox = renderMessageUI("ai", "", false);
            let i = 0;
            function type() {
                if (i < msg.length) {
                    aiBox.innerHTML = marked.parse(msg.substring(0, i + 1));
                    i++;
                    setTimeout(type, 12);
                }
            }
            type();
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }

        async function send() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if(!text) return;
            
            input.value = "";
            
            // Get active session
            let activeSession = sessions.find(s => s.id === currentSessionId);
            if (!activeSession) return;

            // Auto-update session title on first user message
            if (activeSession.messages.length === 0) {
                activeSession.title = text.length > 22 ? text.substring(0, 22) + "..." : text;
            }

            // Push User Message
            activeSession.messages.push({ role: "user", content: text });
            renderMessageUI("user", text, true);

            if(text.toLowerCase().includes("generate image")) {
                const prompt = text.replace(/generate image/gi, "").trim();
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
                const imgHtml = `<img src="${url}" class="rounded-2xl border border-white/10 shadow-2xl animate__animated animate__fadeIn max-w-md">`;
                
                activeSession.messages.push({ role: "ai", content: imgHtml });
                renderMessageUI("ai", imgHtml, true);
                saveSessions();
                return;
            }

            const aiBox = renderMessageUI("ai", `<i class="fas fa-circle-notch fa-spin text-cyan-400 opacity-60 mr-2"></i> Processing request...`, true);
            
            try {
                // Build history payload for the model API context
                const apiHistory = activeSession.messages.map(m => ({
                    role: m.role === 'ai' ? 'assistant' : 'user',
                    content: m.content
                }));

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + API, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            ...apiHistory
                        ]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                aiBox.innerHTML = marked.parse(reply);
                activeSession.messages.push({ role: "ai", content: reply });
                saveSessions();
            } catch (e) { 
                aiBox.innerHTML = "Neural connection lost. Please try again."; 
            }
        }

        function renderMessageUI(role, content, shouldScroll) {
            const div = document.createElement("div");
            div.className = `flex ${role === "user" ? "justify-end" : "justify-start"} animate__animated animate__fadeInUp animate__faster`;
            div.innerHTML = `<div class="max-w-[70%] px-6 py-4 rounded-3xl ${role === 'user' ? 'chat-user text-white' : 'chat-ai text-gray-200'} text-sm leading-relaxed">${content ? marked.parse(content) : ''}</div>`;
            
            const chatContainer = document.getElementById("chat");
            chatContainer.appendChild(div);
            if (shouldScroll) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            return div.querySelector('.chat-ai');
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
